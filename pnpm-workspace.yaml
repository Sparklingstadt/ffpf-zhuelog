overrides:
  "deepmerge-ts": "8.0.2"
  "mysql2": "3.24.4"
allowBuilds:
  # sass が使うファイル監視。OS ごとのビルド済みバイナリが optionalDependencies で
  # 入るので、ソースからビルドする install スクリプトは動かさない。
  "@parcel/watcher": false
  "@prisma/engines": true
  "esbuild": true
  "fsevents": true
  "lefthook": true
  "prisma": true
  "unrs-resolver": true
auditConfig:
  ignoreGhsas:
    # minimatch <11.0.1: 修正版は v11 のみで、v3／v10 系には出ていない。eslint と
    # typescript-eslint 経由の開発時のみの依存で、アプリの実行時には読み込まれない。
    # 依存元が v11 に対応したら削除する。
    - GHSA-g3hv-75wg-m249
