overrides:
  "deepmerge-ts": "8.0.2"
  # @prisma/config が 3.20.0 に固定している。3.22.0 以下は GHSA-7589-6fvf-x4pw
  # （Schema.TemplateLiteral の ReDoS）に当たるので、直った最初の版に上げる。
  # Prisma が 3.22.1 以上を使うようになったら削除する。
  "effect": "3.22.1"
  # minimatch 10 以下は GHSA-g3hv-75wg-m249（globparts による DoS）に当たり、
  # 直った版は 11.0.1 以上だけ。@typescript-eslint/typescript-estree が ^10 を
  # 求めているが、使うのは minimatch() 1 つで、v11 でも同じ形なので上げる。
  # typescript-eslint が v11 を使うようになったら削除する。
  "minimatch@>=7 <11.0.1": "11.0.9"
  "mysql2": "3.24.4"
allowBuilds:
  # sass が使うファイル監視。OS ごとのビルド済みバイナリが optionalDependencies で
  # 入るので、ソースからビルドする install スクリプトは動かさない。
  "@parcel/watcher": false
  "@prisma/engines": true
  "esbuild": true
  "fsevents": true
  "lefthook": true
  "prisma": true
  "unrs-resolver": true
