name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://zhuelog:zhuelog@127.0.0.1:5432/zhuelog?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run lint
      - uses: actions/setup-go@v6
        with:
          go-version-file: workers/line/go.mod
          cache-dependency-path: workers/line/go.mod
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://zhuelog_e2e:local-e2e-only@127.0.0.1:55439/zhuelog_e2e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run test:e2e:stop
        if: always()
