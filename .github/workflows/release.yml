name: release

# After verify passes on main: when the push changed the version in
# package.json and docs/releases/v<version>.md exists, tag that commit,
# publish a GitHub Release with the note as its text, and switch production
# to it (deploy.yml). A merge that leaves the version alone releases nothing.
#
# Run it by hand to release the head of main when the automatic run was
# missed, for example because verify failed on the commit that changed the
# version and passed on a later one.

on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Only verify's runs for pushes to main count; a pull request from a
    # branch that is also called main does not.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      created: ${{ steps.publish.outputs.created }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The commit and its parent, to see whether the version changed.
          fetch-depth: 2
          persist-credentials: false
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(jq -r .version package.json)
          tag="v$version"
          note="docs/releases/$tag.md"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "created=false" >> "$GITHUB_OUTPUT"

          if [ "$MANUAL" != "true" ]; then
            before=$(git show HEAD^:package.json | jq -r .version)
            if [ "$before" = "$version" ]; then
              echo "::notice::The version is still $version; nothing to release."
              exit 0
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released."
            exit 0
          fi
          if [ ! -f "$note" ]; then
            echo "::error::$note is missing. Add the release note, then run this workflow by hand."
            exit 1
          fi

          # The note's first line is "# v1.2.3 — title"; the rest is the text.
          title=$(sed -n '1s/^# *//p' "$note")
          tail -n +2 "$note" | sed '1{/^$/d;}' > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$sha" \
            --title "${title:-$tag}" --notes-file "$RUNNER_TEMP/notes.md"
          echo "created=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: needs.publish.outputs.created == 'true'
    permissions: {}
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ needs.publish.outputs.sha }}
    secrets: inherit
