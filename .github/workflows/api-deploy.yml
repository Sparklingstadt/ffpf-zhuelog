name: API deploy

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: api-deploy

jobs:
  deploy:
    # AWS の Variables を設定するまでは、デプロイ手順をスキップする（docs/api-deployment.md）。
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ap-northeast-1
      SERVICE: ${{ vars.API_SERVICE_NAME }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      OAUTH_CLIENT_ID: ${{ vars.API_GITHUB_CLIENT_ID }}
      OAUTH_REDIRECT_URI: ${{ vars.API_GITHUB_REDIRECT_URI }}
      ALLOWED_LOGINS: ${{ vars.API_ALLOWED_GITHUB_LOGINS }}
      SECRET_DATABASE_URL_ARN: ${{ vars.API_SECRET_DATABASE_URL_ARN }}
      SECRET_JWT_ARN: ${{ vars.API_SECRET_JWT_ARN }}
      SECRET_GITHUB_CLIENT_SECRET_ARN: ${{ vars.API_SECRET_GITHUB_CLIENT_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          image="${REGISTRY}/${ECR_REPOSITORY}:${SHA}"
          docker build --tag "$image" services/api
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - id: config
        name: Build container settings
        # jq で組み立てるので、許可リストのカンマや値の中の引用符で JSON が壊れない。
        run: |
          environment=$(jq -cn \
            --arg id "$OAUTH_CLIENT_ID" \
            --arg uri "$OAUTH_REDIRECT_URI" \
            --arg logins "$ALLOWED_LOGINS" \
            '[{name: "GITHUB_MOBILE_CLIENT_ID", value: $id},
              {name: "GITHUB_MOBILE_REDIRECT_URI", value: $uri},
              {name: "AUTH_ALLOWED_GITHUB_LOGINS", value: $logins}]')
          secrets=$(jq -cn \
            --arg db "$SECRET_DATABASE_URL_ARN" \
            --arg jwt "$SECRET_JWT_ARN" \
            --arg gh "$SECRET_GITHUB_CLIENT_SECRET_ARN" \
            '[{name: "DATABASE_URL", valueFrom: $db},
              {name: "API_JWT_SECRET", valueFrom: $jwt},
              {name: "GITHUB_MOBILE_CLIENT_SECRET", valueFrom: $gh}]')
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "secrets=$secrets" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ vars.API_SERVICE_NAME }}
          image: ${{ env.IMAGE }}
          execution-role-arn: ${{ vars.AWS_ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.AWS_ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 8080
          health-check-path: /health
          cpu: "512"
          memory: "1024"
          min-task-count: 1
          max-task-count: 2
          log-group: /ecs/${{ vars.API_SERVICE_NAME }}
          environment-variables: ${{ steps.config.outputs.environment }}
          secrets: ${{ steps.config.outputs.secrets }}
      - name: Show endpoint
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
        run: |
          echo "API endpoint: ${ENDPOINT}" >> "$GITHUB_STEP_SUMMARY"
