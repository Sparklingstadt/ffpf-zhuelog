<title>Voxel Hangar</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<style>
  :root {
    --bg: #e9edf1;
    --fg: #1d2630;
    --muted: #5d6b78;
    --panel: rgba(255, 255, 255, 0.75);
    --border: #c9d2da;
    --accent: #c8452c;
    --sky-top: #b9cde0;
    --sky-bottom: #eef2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151b;
      --fg: #e3e9ee;
      --muted: #8d9aa6;
      --panel: rgba(20, 28, 36, 0.78);
      --border: #2b3844;
      --accent: #ff7a5c;
      --sky-top: #0b1520;
      --sky-bottom: #1d2a36;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151b;
    --fg: #e3e9ee;
    --muted: #8d9aa6;
    --panel: rgba(20, 28, 36, 0.78);
    --border: #2b3844;
    --accent: #ff7a5c;
    --sky-top: #0b1520;
    --sky-bottom: #1d2a36;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 system-ui,
      -apple-system,
      "Hiragino Sans",
      sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
  }
  canvas {
    display: block;
    touch-action: none;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
  header,
  footer {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  header h1 {
    margin: 0 8px 0 0;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    pointer-events: auto;
  }
  nav button {
    font: inherit;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  nav button[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  nav button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  nav button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    color: var(--muted);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    pointer-events: none;
  }
  #info {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--fg);
    backdrop-filter: blur(6px);
  }
</style>
<div id="stage"></div>
<header>
  <h1>Voxel Hangar</h1>
  <nav id="nav"></nav>
</header>
<footer>
  <span id="info">読み込み中…</span>
  <span
    >ドラッグで回転 ・ ホイール/ピンチで拡大 ・
    ダブルクリックで自動回転の切替</span
  >
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // models/<id>.js を順に読み込む。存在しないファイルは飛ばす。
  const MODEL_IDS = [
    "f14",
    "f15c",
    "su33",
    "su57",
    "x02",
    "adf11f",
    "f22a",
    "su37",
    "mig29",
    "f35c",
    "f2",
    "a10",
  ];
  window.VOXEL_MODELS = window.VOXEL_MODELS || {};
  function loadScript(src, retries = 1) {
    return new Promise((resolve) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = () => resolve(true);
      s.onerror = () => {
        s.remove();
        // 同時接続でリセットされることがあるので一度だけ読み直す
        resolve(retries > 0 ? loadScript(src, retries - 1) : false);
      };
      document.head.appendChild(s);
    });
  }
  Promise.all(MODEL_IDS.map((id) => loadScript(`models/${id}.js`))).then(start);

  function start() {
    const stage = document.getElementById("stage");
    const info = document.getElementById("info");
    const nav = document.getElementById("nav");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 2000);

    scene.add(new THREE.HemisphereLight(0xdfe9f3, 0x4a5560, 0.75));
    const sun = new THREE.DirectionalLight(0xffffff, 0.85);
    sun.position.set(60, 120, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, {
      left: -120,
      right: 120,
      top: 120,
      bottom: -120,
      near: 1,
      far: 400,
    });
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600),
      new THREE.ShadowMaterial({ opacity: 0.18 }),
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const root = new THREE.Group();
    scene.add(root);

    // 6方向すべてが埋まっているボクセルは見えないので描画しない
    function buildMesh(model) {
      const key = (x, y, z) => `${x},${y},${z}`;
      const filled = new Set(model.voxels.map((v) => key(v[0], v[1], v[2])));
      const visible = model.voxels.filter(
        ([x, y, z]) =>
          !(
            filled.has(key(x + 1, y, z)) &&
            filled.has(key(x - 1, y, z)) &&
            filled.has(key(x, y + 1, z)) &&
            filled.has(key(x, y - 1, z)) &&
            filled.has(key(x, y, z + 1)) &&
            filled.has(key(x, y, z - 1))
          ),
      );

      const geo = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshLambertMaterial();
      const mesh = new THREE.InstancedMesh(geo, mat, visible.length);
      mesh.castShadow = true;
      mesh.frustumCulled = false; // 境界球が1マス分しかないため、カリングされないようにする
      mesh.receiveShadow = true;

      const box = new THREE.Box3();
      model.voxels.forEach(([x, y, z]) =>
        box.expandByPoint(new THREE.Vector3(x, y, z)),
      );
      const center = box.getCenter(new THREE.Vector3());

      const m = new THREE.Matrix4();
      const color = new THREE.Color();
      const colorCache = {};
      visible.forEach(([x, y, z, c], i) => {
        m.makeTranslation(x - center.x, y - box.min.y + 0.5, z - center.z);
        mesh.setMatrixAt(i, m);
        if (!colorCache[c])
          colorCache[c] = new THREE.Color(model.palette[c] || "#ff00ff");
        mesh.setColorAt(i, color.copy(colorCache[c]));
      });
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

      // 解像度の違う機体（1m=6 など）を 1m=3 に縮めて、実寸の比率で並ぶようにする
      const vpm =
        model.voxelsPerMeter || VOXELS_PER_METER[model.id] || BASE_VPM;
      const k = BASE_VPM / vpm;
      mesh.scale.setScalar(k);

      const grid = box.getSize(new THREE.Vector3()).addScalar(1);
      const size = grid.clone().multiplyScalar(k);
      return { mesh, size, grid, vpm, total: model.voxels.length };
    }
    const BASE_VPM = 3;
    // voxelsPerMeter を書いていないが 1m=6 で作られたファイル
    const VOXELS_PER_METER = { f15c: 6, su37: 6 };

    const built = {};
    MODEL_IDS.forEach((id) => {
      const model = window.VOXEL_MODELS[id];
      if (model && Array.isArray(model.voxels) && model.voxels.length)
        built[id] = { model, ...buildMesh(model) };
    });

    let current = location.hash.slice(1) || "all";
    if (current !== "all" && !built[current]) current = "all";

    const buttons = {};
    ["all", ...MODEL_IDS].forEach((id) => {
      const b = document.createElement("button");
      b.textContent =
        id === "all"
          ? "全機"
          : window.VOXEL_MODELS[id]?.name || id.toUpperCase();
      b.disabled = id !== "all" && !built[id];
      if (b.disabled) b.title = "未作成";
      b.onclick = () => show(id);
      nav.appendChild(b);
      buttons[id] = b;
    });

    let radius = 100;
    let yaw = -0.8,
      pitch = 0.42,
      distance = 120,
      autoRotate = true;

    function show(id) {
      current = id;
      Object.entries(buttons).forEach(([k, b]) =>
        b.setAttribute("aria-pressed", String(k === id)),
      );
      try {
        history.replaceState(
          null,
          "",
          id === "all" ? location.pathname : `#${id}`,
        );
      } catch (e) {}

      root.clear();
      const ids = id === "all" ? Object.keys(built) : [id];
      if (!ids.length) {
        info.textContent =
          "まだモデルがありません（models/*.js を待っています）";
        return;
      }

      // 全機表示は格子状の駐機列。間隔は最大寸法から決める。
      const span =
        Math.max(
          ...ids.map((k) => Math.max(built[k].size.x, built[k].size.z)),
        ) + 10;
      const cols = Math.ceil(Math.sqrt(ids.length));
      const rows = Math.ceil(ids.length / cols);
      ids.forEach((k, i) => {
        const g = built[k].mesh;
        g.position.set(
          ((i % cols) - (cols - 1) / 2) * span,
          0,
          (Math.floor(i / cols) - (rows - 1) / 2) * span,
        );
        root.add(g);
      });
      // 機数が増えたら影の範囲も広げる
      const half = (Math.max(cols, rows) * span) / 2 + 20;
      Object.assign(sun.shadow.camera, {
        left: -half,
        right: half,
        top: half,
        bottom: -half,
      });
      sun.shadow.camera.updateProjectionMatrix();
      // InstancedMesh は setFromObject で正しい範囲が取れないので、各機の寸法から求める
      const box = new THREE.Box3();
      ids.forEach((k) => {
        const { mesh, size } = built[k];
        box.expandByPoint(
          new THREE.Vector3(
            mesh.position.x - size.x / 2,
            0,
            mesh.position.z - size.z / 2,
          ),
        );
        box.expandByPoint(
          new THREE.Vector3(
            mesh.position.x + size.x / 2,
            size.y,
            mesh.position.z + size.z / 2,
          ),
        );
      });
      radius = box.getBoundingSphere(new THREE.Sphere()).radius;
      distance = radius * 2.6;

      info.textContent =
        ids.length > 4
          ? `${ids.length}機 ・ 計 ${ids.reduce((s, k) => s + built[k].total, 0).toLocaleString()} voxels`
          : ids
              .map((k) => {
                const b = built[k];
                const m = b.grid.clone().divideScalar(b.vpm);
                return `${b.model.name}: ${b.total.toLocaleString()} voxels ・ 全長 ${m.x.toFixed(1)}m × 全幅 ${m.z.toFixed(1)}m`;
              })
              .join(" ／ ");
    }

    function resize() {
      const w = stage.clientWidth,
        h = stage.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize);
    resize();

    // ポインタ操作（ドラッグ回転・ホイールとピンチで拡大縮小）
    const pointers = new Map();
    let pinchStart = 0,
      distStart = 0;
    const el = renderer.domElement;
    el.addEventListener("pointerdown", (e) => {
      el.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      autoRotate = false;
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
        distStart = distance;
      }
    });
    el.addEventListener("pointermove", (e) => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      if (pointers.size === 1) {
        yaw -= (e.clientX - p.x) * 0.008;
        pitch = Math.min(
          1.45,
          Math.max(-0.2, pitch + (e.clientY - p.y) * 0.008),
        );
      }
      p.x = e.clientX;
      p.y = e.clientY;
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        distance = clampDist(
          (distStart * pinchStart) /
            Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
        );
      }
    });
    const up = (e) => pointers.delete(e.pointerId);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        distance = clampDist(distance * Math.exp(e.deltaY * 0.001));
      },
      { passive: false },
    );
    el.addEventListener("dblclick", () => {
      autoRotate = !autoRotate;
    });
    function clampDist(d) {
      return Math.min(radius * 6, Math.max(radius * 0.9, d));
    }

    show(current);
    addEventListener("hashchange", () => {
      const id = location.hash.slice(1) || "all";
      if (id !== current && (id === "all" || built[id])) show(id);
    });

    let last = performance.now();
    renderer.setAnimationLoop((now) => {
      const dt = (now - last) / 1000;
      last = now;
      if (autoRotate) yaw += dt * 0.25;
      const target = new THREE.Vector3(0, radius * 0.15, 0);
      camera.position.set(
        target.x + distance * Math.cos(pitch) * Math.sin(yaw),
        target.y + distance * Math.sin(pitch),
        target.z + distance * Math.cos(pitch) * Math.cos(yaw),
      );
      camera.lookAt(target);
      renderer.render(scene, camera);
    });
  }
</script>
