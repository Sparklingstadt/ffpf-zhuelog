services:
  postgres:
    image: postgres:17-alpine
    container_name: ffpf-zhuelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhuelog
      POSTGRES_PASSWORD: zhuelog
      POSTGRES_DB: zhuelog
    ports:
      # Keep the development database reachable only from this machine.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhuelog -d zhuelog"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - zhuelog_postgres_data:/var/lib/postgresql/data

volumes:
  zhuelog_postgres_data:
