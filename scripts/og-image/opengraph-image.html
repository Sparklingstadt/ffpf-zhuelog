<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>学习録 OGP 画像の元</title>
    <style>
      /* 1200×630 の OGP 画像。scripts/render-og-image.mjs が Chromium で
         この文書を撮って src/app/opengraph-image.png に書き出します。
         色は src/app/globals.css のライトテーマと同じです。 */
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.53 0 0);
        --border: oklch(0.922 0 0);
        --primary: oklch(0.51 0.14 163);
        --primary-foreground: oklch(0.985 0 0);
        --primary-soft: oklch(0.96 0.03 163);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        background:
          radial-gradient(
            900px 500px at 100% 0%,
            var(--primary-soft) 0%,
            transparent 60%
          ),
          var(--background);
        color: var(--foreground);
        font-family:
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
          "Noto Sans CJK JP", "IPAGothic", "Yu Gothic", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .left {
        display: flex;
        flex: 1 1 0;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 0 64px 80px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        align-self: flex-start;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--muted);
        color: var(--foreground);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .badge .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--primary);
      }
      .title {
        margin-top: 28px;
        font-size: 128px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin-top: 20px;
        font-size: 40px;
        font-weight: 600;
        color: var(--primary);
      }
      .lead {
        margin-top: 28px;
        max-width: 620px;
        font-size: 28px;
        line-height: 1.55;
        color: var(--muted-foreground);
        /* 改行を文節の切れ目にします（「覚え｜る」にしない）。 */
        word-break: auto-phrase;
      }
      .url {
        font-size: 26px;
        font-weight: 600;
        color: var(--muted-foreground);
        letter-spacing: 0.01em;
      }
      .right {
        display: flex;
        align-items: center;
        width: 440px;
        padding-right: 80px;
      }
      .card {
        width: 100%;
        border: 2px solid var(--border);
        border-radius: 24px;
        background: var(--background);
        box-shadow: 0 24px 60px oklch(0.145 0 0 / 0.1);
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 28px;
        border-bottom: 2px solid var(--border);
        font-size: 20px;
        color: var(--muted-foreground);
      }
      .card-head b {
        color: var(--foreground);
        font-weight: 600;
      }
      .row {
        padding: 22px 28px;
      }
      .row + .row {
        border-top: 2px solid var(--border);
      }
      .label {
        font-size: 18px;
        font-weight: 600;
        color: var(--muted-foreground);
        letter-spacing: 0.04em;
      }
      .zh {
        margin-top: 8px;
        font-size: 27px;
        font-weight: 600;
        line-height: 1.3;
      }
      .zh .fix {
        color: var(--primary);
        text-decoration: underline;
        text-decoration-thickness: 3px;
        text-underline-offset: 6px;
      }
      .pinyin {
        margin-top: 6px;
        font-size: 17px;
        color: var(--muted-foreground);
        font-family:
          "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      .hint {
        display: inline-flex;
        margin-top: 12px;
        padding: 6px 12px;
        border-radius: 8px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 18px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div>
        <div class="badge"><span class="dot"></span>Chinese learning log</div>
        <div class="title">学习録</div>
        <div class="subtitle">中国語学習ノート</div>
        <div class="lead">
          自分が書いた文と添削後の文を、ピンインと覚えるべきヒントと一緒に蓄積する。
        </div>
      </div>
      <div class="url">ffpf-zhuelog.sparklingstadt.com</div>
    </div>
    <div class="right">
      <div class="card">
        <div class="card-head"><b>今日のノート</b><span>2 件</span></div>
        <div class="row">
          <div class="label">原文</div>
          <div class="zh">我昨天去图书馆看书了。</div>
        </div>
        <div class="row">
          <div class="label">添削</div>
          <div class="zh">我昨天<span class="fix">在</span>图书馆看书了。</div>
          <div class="pinyin">wǒ zuótiān zài túshūguǎn kànshū le</div>
          <div class="hint">場所は「在」で示す</div>
        </div>
      </div>
    </div>
  </body>
</html>
