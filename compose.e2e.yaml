name: zhuelog-e2e
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zhuelog_e2e
      POSTGRES_PASSWORD: local-e2e-only
      POSTGRES_DB: zhuelog_e2e
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhuelog_e2e -d zhuelog_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
