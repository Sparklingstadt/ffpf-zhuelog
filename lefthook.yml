pre-commit:
  piped: true
  commands:
    format:
      priority: 1
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,md,mdx,yml,yaml,html}"
      exclude: "(^|/)(pnpm-lock.yaml|src/generated/|prisma/seed.private.json)"
      run: pnpm exec prettier --write "{staged_files}"
      stage_fixed: true
    lint:
      priority: 2
      run: pnpm run lint
    typecheck:
      priority: 3
      run: pnpm run typecheck

pre-push:
  piped: true
  commands:
    lint:
      priority: 1
      run: pnpm run lint
    typecheck:
      priority: 2
      run: pnpm run typecheck
    e2e:
      priority: 3
      run: |
        set -e
        trap 'pnpm run test:e2e:stop' EXIT
        pnpm run test:unit
        pnpm run test:e2e
