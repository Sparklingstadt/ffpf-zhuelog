pre-commit:
  piped: true
  commands:
    format:
      priority: 1
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,md,mdx,yml,yaml,html}"
      exclude: "(^|/)(pnpm-lock.yaml|src/generated/|prisma/seed.private.json)"
      run: pnpm exec prettier --write "{staged_files}"
      stage_fixed: true
    lint:
      priority: 2
      run: pnpm run lint
    typecheck:
      priority: 3
      run: pnpm run typecheck
    gofmt:
      priority: 4
      root: "services/api/"
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})" || { gofmt -l {staged_files}; echo "gofmt が必要です"; exit 1; }

pre-push:
  piped: true
  commands:
    lint:
      priority: 1
      run: pnpm run lint
    typecheck:
      priority: 2
      run: pnpm run typecheck
    # Store and server tests that need Postgres skip unless
    # API_TEST_DATABASE_URL is set (see services/api/main_test.go).
    go:
      priority: 3
      root: "services/api/"
      run: go vet ./... && go test ./...
    e2e:
      priority: 4
      run: |
        set -e
        trap 'pnpm run test:e2e:stop' EXIT
        pnpm run test:unit
        pnpm run test:e2e
